spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:h2:mem:smsmonitor;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
    enabled: true

google:
  credentials:
    path: ${GOOGLE_CREDENTIALS_PATH:data/important/smsreceiver.json}
  sheets:
    spreadsheet-id: ${GOOGLE_SHEETS_SPREADSHEET_ID:}
    sheet-name: ${GOOGLE_SHEETS_SHEET_NAME:sheet1}

jwt:
  secret: ${JWT_SECRET:very-strong-secret-key-at-least-32-characters-long}
  access-token-expiration: 2592000000 # 30일 (ms)
  refresh-token-expiration: 7776000000 # 90일 (ms)

logging:
  file:
    name: build/logs/app.log
  level:
    com.mk.www.smsmonitor: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

server:
  address: 0.0.0.0
  port: 8080

---